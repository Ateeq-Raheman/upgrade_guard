hop: {from: 15, to: 16}
source: https://github.com/frappe/frappe/wiki/Migrating-to-version-16
status: complete   # every item of the wiki page is covered (detectable ones as rules, UI ones as manual checks)
rules:
- {id: V16-001, title: "Python 3.14+ required", severity: blocker, category: environment, kind: env, python_min: "3.14", fix: "Install Python 3.14+ on the target bench host before switching branches.", link: "https://docs.frappe.io/framework/user/en/installation"}
- {id: V16-002, title: "Node.js 24+ required", severity: blocker, category: environment, kind: env, node_min: "24", fix: "Install Node.js 24+ before running bench build.", link: "https://docs.frappe.io/framework/user/en/installation"}
- {id: V16-003, title: "App does not register add_to_apps_screen", severity: medium, category: ui, kind: hook_missing, key: add_to_apps_screen, custom_apps_only: true, fix: "Add the add_to_apps_screen hook in hooks.py so the app icon shows on the new Desktop.", link: "https://docs.frappe.io/framework/user/en/apps-page#how-can-we-show-our-custom-apps-on-apps-page"}
- {id: V16-004, title: "Hard-coded /app URL (Desk moved to /desk)", severity: medium, category: routing, kind: regex, pattern: "[\"'`=(]\\s*(?:https?://[^\"'`\\s]+)?/app(?:/[a-z0-9_-]+)*[\"'`)/]", languages: [python, js, html], confidence: low, fix: "Build URLs with frappe.utils.get_url_to_form/get_url_to_list or replace /app with /desk.", autofix: {safe: false, replace: [{pattern: "(?<![\\w/])/app/", with: "/desk/"}]}}
- {id: V16-005, title: "Energy Points moved to separate app (frappe/eps)", severity: high, category: moved-app, kind: regex, pattern: "Energy Point (Log|Rule|Settings)|energy_point|\\.social\\.doctype\\.energy", languages: [python, js, html, json, server_script, client_script], fix: "bench get-app https://github.com/frappe/eps and install it on the site.", link: "https://github.com/frappe/frappe/pull/32040"}
- {id: V16-006, title: "Newsletter moved to separate app", severity: high, category: moved-app, kind: regex, pattern: "\\.email\\.doctype\\.(newsletter|email_group)|[\"']Newsletter[\"']|[\"']Email Group( Member)?[\"']", languages: [python, js, html, json, server_script, client_script], fix: "bench get-app https://github.com/frappe/newsletter and install it.", link: "https://github.com/frappe/frappe/pull/32971"}
- {id: V16-007, title: "Backup integrations (Dropbox/S3/Google Drive) moved to offsite_backups", severity: high, category: moved-app, kind: regex, pattern: "Dropbox Settings|S3 Backup Settings|Google Drive[\"']|\\.integrations\\.doctype\\.(dropbox_settings|s3_backup_settings|google_drive)", languages: [python, js, html, json, server_script, client_script], fix: "bench get-app https://github.com/frappe/offsite_backups and install it.", link: "https://github.com/frappe/frappe/pull/32351"}
- {id: V16-008, title: "Blog moved to separate app", severity: high, category: moved-app, kind: regex, pattern: "[\"']Blog (Post|Category|Settings)[\"']|[\"']Blogger[\"']|\\.website\\.doctype\\.(blog_post|blogger|blog_category)", languages: [python, js, html, json, server_script, client_script], fix: "bench get-app https://github.com/frappe/blog and install it.", link: "https://github.com/frappe/frappe/pull/32737"}
- {id: V16-009, title: "frappe.db.commit() inside doc_events hook", severity: high, category: database, kind: hook_funcs, hook: doc_events, check: commit, fix: "Remove frappe.db.commit() from document hooks; it is no longer supported there."}
- {id: V16-010, title: "get_translated_dict hook removed", severity: blocker, category: hooks, kind: hook_key, key: get_translated_dict, fix: "Move translations into the app's translation files.", link: "https://github.com/frappe/frappe/pull/22962"}
- {id: V16-011, title: "frappe.geo.country_info.get_translated_dict deprecated", severity: medium, category: python-api, kind: py_name, names: ["*.country_info.get_translated_dict", "frappe.geo.country_info.get_translated_dict"], fix: "Use get_translated_countries.", link: "https://github.com/frappe/frappe/pull/22962"}
- {id: V16-012, title: "Translation helpers removed", severity: blocker, category: python-api, kind: py_name, names: ["frappe.get_lang_dict", "frappe.translate.get_dict", "frappe.translate.get_lang_js", "frappe.translate.get_dict_from_hooks"], fix: "Use _() instead.", link: "https://github.com/frappe/frappe/pull/22962"}
- {id: V16-013, title: "doc.meta.__messages no longer holds doc translations", severity: low, category: python-api, kind: regex, pattern: "meta\\.__messages", languages: [python, js, server_script], fix: "Use _() for translations.", link: "https://github.com/frappe/frappe/pull/22962"}
- {id: V16-014, title: "has_permission hook may return None (must explicitly return True)", severity: high, category: permissions, kind: hook_funcs, hook: has_permission, check: returns_true, fix: "Return True explicitly in every allow path of has_permission hooks.", link: "https://github.com/frappe/frappe/pull/24253"}
- {id: V16-015, title: "has_permission(raise_exception=...) no longer accepted", severity: high, category: python-api, kind: py_call_kw, names: ["frappe.permission.has_permission", "frappe.permissions.has_permission"], kwarg: raise_exception, fix: "Use print_logs.", link: "https://github.com/frappe/frappe/pull/24266"}
- {id: V16-016, title: "Default list sort is now `creation`, not `modified`", severity: medium, category: doctype, kind: doctype_json, match: {sort_field: modified}, fix: "Set the DocType sort_field to creation (the modified index is dropped on migrate otherwise).", autofix: {json_set: {sort_field: creation}}}
- {id: V16-017, title: "Implicit sort order changed (get_all/get_list/get_value without order_by)", severity: low, category: python-api, kind: py_call_no_kw, names: ["frappe.get_all", "frappe.get_list", "frappe.db.get_all", "frappe.db.get_list", "frappe.db.get_values", "frappe.qb.get_query"], missing_kwarg: order_by, only_if_any_kwarg: [limit, limit_page_length, pluck], confidence: low, fix: "Pass order_by='modified desc' explicitly where result order matters."}
- {id: V16-018, title: "Re-add modified index if queries depend on it", severity: info, category: database, kind: manual, fix: "In on_doctype_update(): frappe.db.add_index('Doctype Name', ['modified'])"}
- {id: V16-019, title: "Country records require ISO ALPHA-2 code", severity: medium, category: doctype, kind: manual, fix: "Ensure every Country has a valid 2-letter code before migrating."}
- {id: V16-020, title: "frappe.flags.in_test deprecated", severity: medium, category: python-api, kind: py_name, names: ["frappe.flags.in_test"], fix: "Use frappe.in_test; set via frappe.tests.utils.toggle_test_mode.", link: "https://github.com/frappe/frappe/pull/32960", autofix: {replace: [{pattern: "frappe\\.flags\\.in_test", with: "frappe.in_test", unless: "frappe\\.flags\\.in_test\\s*=(?!=)"}]}}
- {id: V16-021, title: "db.get_value on Single DocTypes returns typed values", severity: medium, category: python-api, kind: regex, pattern: "get_(single_)?value\\([^)]*\\)\\s*(==|!=)\\s*[\"'](0|1)[\"']", languages: [python, server_script], confidence: low, fix: "Compare with 1/0 instead of '1'/'0'."}
- {id: V16-022, title: "SQL function strings in get_all/get_list fields", severity: high, category: query-builder, kind: py_call_sql_args, names: ["frappe.get_all", "frappe.get_list", "frappe.db.get_all", "frappe.db.get_list"], args: [fields, filters, order_by, group_by, or_filters], fix: "Use dict syntax {'SUM': 'field', 'as': 'alias'} or frappe.query_builder.functions; see query-builder-migration guide.", link: "https://github.com/frappe/frappe/wiki/query-builder-migration"}
- {id: V16-023, title: "Transaction Log DocType removed", severity: high, category: doctype, kind: regex, pattern: "Transaction Log", languages: [python, js, html, json, server_script, client_script], fix: "Remove usages of Transaction Log / Transaction Log Report.", link: "https://github.com/frappe/frappe/pull/33844"}
- {id: V16-024, title: "State-changing whitelisted methods now require POST", severity: medium, category: api, kind: regex, pattern: "/api/method/(logout|web_logout|upload_file|frappe\\.www\\.login\\.send_login_link)", languages: [python, js, html, server_script, client_script], fix: "Call these endpoints with POST, not GET."}
- {id: V16-025, title: "Report/Page/Dashboard Chart JS evaluated as IIFE (top-level globals not shared)", severity: medium, category: js-api, kind: regex, pattern: "^(?:var|let|const|function)\\s+\\w+", languages: [js], path_glob: ["**/report/**/*.js", "**/page/**/*.js", "**/dashboard_chart/**/*.js"], confidence: low, fix: "Assign intended globals through window.<name>.", link: "https://github.com/frappe/frappe/pull/33973"}
- {id: V16-026, title: "`bench version` default format changed to plain", severity: low, category: cli, kind: regex, pattern: "bench\\s+version(?!\\s+-f)", languages: [python, text], fix: "Parse plain output or pass -f legacy.", link: "https://github.com/frappe/frappe/pull/33621"}
- {id: V16-027, title: "meta.get_valid_columns() excludes virtual fields", severity: low, category: python-api, kind: py_name, names: ["*.get_valid_columns"], fix: "Do not rely on virtual fields being returned.", link: "https://github.com/frappe/frappe/pull/27553"}
- {id: V16-028, title: "get_doc(doctype, name, field=value) no longer overwrites fetched values", severity: low, category: python-api, kind: py_call_kw, names: ["frappe.get_doc"], kwarg: "*", min_args: 2, confidence: low, fix: "Set the fields after fetching the doc."}
- {id: V16-029, title: "db.value_cache is now a nested defaultdict", severity: high, category: python-api, kind: regex, pattern: "value_cache\\.(pop|get)\\(\\s*\\(|value_cache\\[\\s*\\(", languages: [python, server_script], fix: "frappe.db.value_cache['User']['Guest'].pop('full_name', None)", link: "https://github.com/frappe/frappe/commit/27e8561197d85f67b63b965c3ef63b2182a37533", autofix: {replace: [{pattern: "value_cache\\.pop\\(\\(\\s*(\"[^\"]+\"|'[^']+')\\s*,\\s*(\"[^\"]+\"|'[^']+')\\s*,\\s*(\"[^\"]+\"|'[^']+')\\s*\\)\\s*,\\s*None\\s*\\)", with: "value_cache[\\1][\\2].pop(\\3, None)"}]}}
- {id: V16-030, title: "db.count(cache=True) now evicted after the transaction", severity: low, category: database, kind: py_call_kw, names: ["frappe.db.count"], kwarg: cache, fix: "Do not rely on stale cached counts across transactions.", link: "https://github.com/frappe/frappe/commit/2d1491881471ec75099c4d1bbbd13f807b6fc786"}
- {id: V16-031, title: "System Console limited to Administrator", severity: info, category: permissions, kind: manual, fix: "Grant other roles via Role Permission Manager if needed."}
- {id: V16-032, title: "GeoIP features removed", severity: medium, category: other, kind: regex, pattern: "(?i)geoip|maxminddb", languages: [python, js, html], fix: "Remove GeoIP usage.", link: "https://github.com/frappe/frappe/commit/daa52b8802fccd9bfab445c980648f11b3fc1236"}
- {id: V16-033, title: "Site config now cached up to one minute", severity: info, category: config, kind: manual, fix: "Expect config changes to take up to 1 minute to reach workers."}
- {id: V16-034, title: "site_cache does not support unhashable arguments", severity: low, category: python-api, kind: py_name, names: ["*.site_cache", "site_cache"], confidence: low, fix: "Never call site_cache functions with dict/list arguments."}
- {id: V16-035, title: "override_doctype class must extend the original", severity: high, category: hooks, kind: hook_funcs, hook: override_doctype, check: extends_base, fix: "Make the override class inherit the original controller.", link: "https://github.com/frappe/frappe/pull/26152"}
- {id: V16-036, title: "frappe.sendmail(now=True) no longer commits", severity: medium, category: database, kind: py_call_kw, names: ["frappe.sendmail"], kwarg: now, fix: "Commit manually after sending if you depended on it."}
- {id: V16-037, title: "Time field no longer defaults to current time", severity: low, category: doctype, kind: manual, fix: "Set explicit defaults ('Now') on Time fields that relied on it.", link: "https://github.com/frappe/frappe/pull/33515"}
- {id: V16-038, title: "`!= None` filter now generates IS NOT NULL", severity: medium, category: database, kind: regex, pattern: "[\"']!=[\"']\\s*,\\s*None|[\"']!=[\"']\\s*:\\s*None", languages: [python, server_script], fix: "Verify the new IS NOT NULL semantics.", link: "https://github.com/frappe/frappe/pull/34207"}
- {id: V16-039, title: "UI changes: Awesome Bar, sidebar, list view sidebar, map view, workspace sidebar, Desktop icons", severity: info, category: ui, kind: manual, fix: "Retrain users; curate the Workspace Sidebar; private workspaces moved to My Workspaces; /apps deprecated."}
- {id: V16-040, title: "Customized standard workspaces are lost on migration", severity: high, category: ui, kind: manual, fix: "Copy customized standard workspaces (Buying, Selling...) to clipboard before migrating and restore after."}
- {id: V16-041, title: "bleach replaced by nh3 for sanitization", severity: medium, category: dependency, kind: regex, pattern: "^\\s*(import bleach|from bleach)", languages: [python], fix: "Declare bleach in your app's own dependencies."}
- {id: V16-042, title: "FrappeTestCase deprecated (removed in v17)", severity: medium, category: testing, kind: regex, pattern: "FrappeTestCase", languages: [python], fix: "Use IntegrationTestCase (DB) or UnitTestCase from frappe.tests.", link: "https://github.com/frappe/frappe/wiki#testing-guide", autofix: {replace: [{pattern: "from frappe\\.tests\\.utils import FrappeTestCase(?=[ \\t]*$)", with: "from frappe.tests import IntegrationTestCase"}, {pattern: "FrappeTestCase", with: "IntegrationTestCase", unless: "^\\s*(from|import)\\b"}]}}
- {id: V16-043, title: "Test attributes renamed", severity: medium, category: testing, kind: regex, pattern: "^\\s*(test_dependencies|test_ignore)\\s*=", languages: [python], fix: "test_dependencies -> EXTRA_TEST_RECORD_DEPENDENCIES; test_ignore -> IGNORE_TEST_RECORD_DEPENDENCIES.", autofix: {replace: [{pattern: "^(\\s*)test_dependencies(\\s*=)", with: "\\1EXTRA_TEST_RECORD_DEPENDENCIES\\2"}, {pattern: "^(\\s*)test_ignore(\\s*=)", with: "\\1IGNORE_TEST_RECORD_DEPENDENCIES\\2"}]}}
- {id: V16-044, title: "setUpClass override must call super().setUpClass()", severity: medium, category: testing, kind: py_setupclass, fix: "Add super().setUpClass() in the override."}
- {id: V16-045, title: "Classic print format (deprecated, stops working in v17)", severity: high, category: print, kind: db_print_classic, fix: "Convert with the Print Format Editor 'convert' button; use Save & Apply for shipped formats."}
- {id: V16-046, title: "Print CSS classes renamed", severity: medium, category: print, kind: regex, pattern: "\\.print-format(?![\\w-])|\\.section-break\\b|\\.data-field\\b", languages: [html, css, db_print], fix: ".print-format -> .print-format-doc, .section-break -> .section, .data-field -> .field .label/.value"}
- {id: V16-047, title: "Print PDFs use Chromium (wkhtmltopdf for converted formats dropped)", severity: medium, category: environment, kind: env_chromium, fix: "Run bench setup-chrome or set chromium_path in common_site_config.json.", }
- {id: V16-048, title: "create_custom_format(beta=False) now throws", severity: high, category: print, kind: py_call_kw, names: ["*.create_custom_format", "create_custom_format"], kwarg: beta, fix: "Create formats in the Print Format Editor."}
- {id: V16-049, title: "App caps frappe dependency below 16", severity: blocker, category: dependency, kind: pyproject_frappe_cap, fix: "Raise [tool.bench.frappe-dependencies] frappe to >=16.0.0-dev,<17.0.0 (after fixing the app) or bench update will refuse."}
- {id: V16-050, title: "Removed/deprecated stdlib modules (Python 3.12-3.14)", severity: high, category: environment, kind: regex, pattern: "^\\s*(import|from)\\s+(imp|distutils|asyncore|asynchat|smtpd|cgi|cgitb|pipes|telnetlib|nntplib|crypt|imghdr|sndhdr|aifc|audioop|chunk|mailcap|msilib|nis|ossaudiodev|spwd|sunau|uu|xdrlib)\\b", languages: [python], fix: "Replace the removed stdlib module; Python 3.14 dropped it."}
- {id: V16-051, title: "Filters JSON with deprecated 5th element (Dashboard Chart / Number Card)", severity: medium, category: query-builder, kind: db_filters_json, fix: "Remove the 5th element: valid filter lengths are 2, 3 or 4.", link: "https://github.com/frappe/frappe/wiki/query-builder-migration"}
- {id: V16-052, title: "run=False now returns a QueryBuilder object, not a SQL string", severity: medium, category: query-builder, kind: py_call_kw, names: ["frappe.get_all", "frappe.get_list", "frappe.db.get_all", "frappe.db.get_list"], kwarg: run, fix: "Call .get_sql() on the returned query to get the SQL string.", link: "https://github.com/frappe/frappe/wiki/query-builder-migration"}
