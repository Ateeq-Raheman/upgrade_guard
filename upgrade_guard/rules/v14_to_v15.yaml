hop: {from: 14, to: 15}
source: https://github.com/frappe/frappe/wiki/Migrating-to-version-15
status: complete
rules:
- {id: V15-001, title: "Event Streaming removed from core", severity: high, category: moved-app, kind: regex, pattern: "Event (Producer|Consumer|Update Log|Sync Log)|\\.event_streaming\\.", languages: [python, js, json, server_script, client_script], fix: "Install the event_streaming app.", link: "https://github.com/frappe/frappe/pull/17910"}
- {id: V15-002, title: "website-image-lazy pattern removed", severity: low, category: ui, kind: regex, pattern: "website-image-lazy", languages: [html, js, css], fix: "Use <img loading=\"lazy\">."}
- {id: V15-003, title: "get_year_ending / get_timespan_date_range now return datetime.date", severity: medium, category: python-api, kind: py_name, names: ["*.get_year_ending", "*.get_timespan_date_range"], fix: "Handle date objects instead of strings."}
- {id: V15-004, title: "Default modified index removed from child tables", severity: info, category: database, kind: manual, fix: "Add the index per DocType if queries need it."}
- {id: V15-005, title: "Python deps dropped from frappe (googlemaps, urllib3, gitdb, pyasn1, pypng, google-auth-httplib2, schedule, pycryptodome)", severity: medium, category: dependency, kind: regex, pattern: "^\\s*(import|from)\\s+(googlemaps|gitdb|pyasn1|png|schedule|Crypto)\\b", languages: [python], fix: "Declare the dependency in your app's pyproject.toml."}
- {id: V15-006, title: "Vue 2 / vuex 3 / vue-router 3 usage (Vue 3 required)", severity: high, category: js-api, kind: regex, pattern: "new Vue\\(|Vue\\.component\\(|Vue\\.extend\\(|from ['\"]vuex['\"]|vue-router", languages: [js], confidence: low, fix: "Migrate to Vue 3, vuex 4.0.2, vue-router 4.1.5, vuedraggable 4.1.0.", link: "https://github.com/frappe/frappe/pull/18247"}
- {id: V15-007, title: "db.sql as_utf8 / formatted removed", severity: high, category: database, kind: py_call_kw, names: ["frappe.db.sql"], kwarg: as_utf8, fix: "Remove the parameter."}
- {id: V15-008, title: "db.sql formatted removed", severity: high, category: database, kind: py_call_kw, names: ["frappe.db.sql"], kwarg: formatted, fix: "Remove the parameter."}
- {id: V15-009, title: "db.set_value for_update removed", severity: high, category: database, kind: py_call_kw, names: ["frappe.db.set_value"], kwarg: for_update, fix: "Remove the parameter."}
- {id: V15-010, title: "db.set removed", severity: blocker, category: database, kind: py_name, names: ["frappe.db.set"], fix: "Use doc.db_set."}
- {id: V15-011, title: "db.touch removed", severity: blocker, category: database, kind: py_name, names: ["frappe.db.touch"], fix: "No replacement; rewrite logic."}
- {id: V15-012, title: "db.clear_table removed", severity: blocker, category: database, kind: py_name, names: ["frappe.db.clear_table"], fix: "Use frappe.db.truncate."}
- {id: V15-013, title: "db.update removed", severity: blocker, category: database, kind: py_name, names: ["frappe.db.update"], fix: "Use frappe.db.set_value."}
- {id: V15-014, title: "db.set_temp / db.get_temp removed", severity: blocker, category: database, kind: py_name, names: ["frappe.db.set_temp", "frappe.db.get_temp"], fix: "No replacement; use cache."}
- {id: V15-015, title: "validate_from_to_dates no longer compares empty date to today", severity: low, category: python-api, kind: py_name, names: ["*.validate_from_to_dates"], fix: "Verify behaviour when one date is empty."}
- {id: V15-016, title: "Session Expiry Mobile / device distinction removed", severity: low, category: config, kind: regex, pattern: "session_expiry_mobile", languages: [python, js, json], fix: "Remove usage.", link: "https://github.com/frappe/frappe/pull/18729"}
- {id: V15-017, title: "frappe.compare removed", severity: high, category: python-api, kind: py_name, names: ["frappe.compare"], fix: "from frappe.utils import compare", autofix: {replace: [{pattern: "frappe\\.compare\\(", with: "frappe.utils.compare("}]}}
- {id: V15-018, title: "db.set_value no longer sets Single values", severity: high, category: database, kind: regex, pattern: "db\\.set_value\\(\\s*(?:(?P<q>[\"'])(?P<d>[^\"']+)(?P=q)\\s*,\\s*(?P=q)(?P=d)(?P=q)|[^,]+,\\s*None)", languages: [python, server_script], fix: "Use frappe.db.set_single_value(doctype, field, value)."}
- {id: V15-019, title: "Client scripts can no longer access local scope (this)", severity: medium, category: js-api, kind: regex, pattern: "(?<![\\w.])this\\.(frm|doc|page|wrapper)\\b", languages: [client_script], confidence: low, fix: "Use frm / frappe references explicitly.", link: "https://github.com/frappe/frappe/pull/19882"}
- {id: V15-020, title: "convert_utc_to_user_timezone renamed", severity: high, category: python-api, kind: py_name, names: ["*.convert_utc_to_user_timezone"], fix: "Use convert_utc_to_system_timezone.", link: "https://github.com/frappe/frappe/pull/20255", autofix: {replace: [{pattern: "convert_utc_to_user_timezone", with: "convert_utc_to_system_timezone"}]}}
- {id: V15-021, title: "get_time_zone renamed", severity: high, category: python-api, kind: py_name, names: ["*.get_time_zone"], fix: "Use get_system_timezone.", link: "https://github.com/frappe/frappe/pull/20255", autofix: {replace: [{pattern: "\\bget_time_zone\\b", with: "get_system_timezone"}]}}
- {id: V15-022, title: "enqueue(job_name=) deprecated", severity: medium, category: python-api, kind: py_call_kw, names: ["frappe.enqueue", "*.enqueue"], kwarg: job_name, fix: "Use job_id."}
- {id: V15-023, title: "frappe.new_doc positional args changed", severity: medium, category: python-api, kind: py_call_kw, names: ["frappe.new_doc"], kwarg: "*", min_args: 2, confidence: low, fix: "Pass parent_doc, parentfield, as_dict as keywords."}
- {id: V15-024, title: "rollback_observers / add_before_commit removed", severity: blocker, category: python-api, kind: py_name, names: ["frappe.local.rollback_observers", "frappe.db.add_before_commit"], fix: "Use the new DB transaction hooks.", link: "https://frappeframework.com/docs/v14/user/en/api/database#database-transaction-hooks"}
- {id: V15-025, title: "redis_socketio merged into redis_queue", severity: info, category: config, kind: manual, fix: "Only change code if you used redis_socketio for something else."}
- {id: V15-026, title: "Node.js 18+ required", severity: blocker, category: environment, kind: env, node_min: "18", link: "https://github.com/frappe/frappe/pull/21370", fix: "Upgrade Node.js."}
- {id: V15-027, title: "Python 3.10+ required", severity: blocker, category: environment, kind: env, python_min: "3.10", fix: "Upgrade Python."}
- {id: V15-028, title: "setup.py removed (pyproject only)", severity: high, category: dependency, kind: path_exists, path_glob: ["setup.py"], app_root: true, fix: "Move metadata into pyproject.toml."}
- {id: V15-029, title: "/fixtures/custom_scripts import removed", severity: medium, category: other, kind: path_exists, path_glob: ["**/fixtures/custom_scripts/**"], fix: "Ship Client Script via normal fixtures."}
- {id: V15-030, title: "get_installed_apps no longer takes sort/frappe_last", severity: medium, category: python-api, kind: py_call_kw, names: ["frappe.get_installed_apps"], kwarg: "*", fix: "Call without arguments."}
- {id: V15-031, title: "bench build --make_copy / --restore removed", severity: low, category: cli, kind: regex, pattern: "bench build.*(--make_copy|--restore)", languages: [text, python], fix: "Use --hard-link."}
- {id: V15-032, title: "window globals removed (get_today, date, dateutil, show_alert, validated, user, user_fullname, user_email, user_defaults, roles, sys_defaults)", severity: high, category: js-api, kind: regex, pattern: "(?<![\\w.$])(get_today\\(|dateutil\\.|show_alert\\(|user_fullname\\b|user_defaults\\b|sys_defaults\\b)|frappe\\.query_report_filters_by_name", languages: [js, client_script], confidence: low, fix: "get_today->frappe.datetime.get_today; show_alert->frappe.show_alert; user->frappe.session.user; roles->frappe.user_roles; query_report_filters_by_name->frappe.query_report.get_filter_value(fieldname)."}
- {id: V15-033, title: "Error Snapshot DocType removed", severity: high, category: doctype, kind: regex, pattern: "Error Snapshot", languages: [python, js, json, server_script, client_script], fix: "Use Error Log."}
- {id: V15-034, title: "SocketIO namespaced per site; custom clients must use ${url}/${site}", severity: medium, category: js-api, kind: regex, pattern: "socket\\.io|io\\(\\s*[\"'`]", languages: [js], confidence: low, fix: "Connect to `${url}/${frappe.local.site}`."}
- {id: V15-035, title: "Event cancelled moved from event_type to status", severity: medium, category: doctype, kind: regex, pattern: "[\"']event_type[\"']\\s*[:,]\\s*[\"']Cancelled[\"']", languages: [python, js, server_script, client_script], fix: "Filter on status = Cancelled."}
- {id: V15-036, title: "Server Scripts disabled by default", severity: high, category: config, kind: env_server_script, fix: "bench set-config -g server_script_enabled 1"}
- {id: V15-037, title: "New restrictive Desk User role", severity: info, category: permissions, kind: manual, fix: "Review core DocType permissions in Role Permission Manager."}
- {id: V15-038, title: "OAuth token/code deletion skips on_trash hooks", severity: low, category: hooks, kind: regex, pattern: "OAuth (Authorization Code|Bearer Token)", languages: [python, json], fix: "Do not rely on on_trash for OAuth docs.", link: "https://github.com/frappe/frappe/pull/22538"}
- {id: V15-039, title: "search_link/search_widget response key results -> message", severity: medium, category: js-api, kind: regex, pattern: "r\\.results|response\\.results|\\.results\\b.*search_link", languages: [js, client_script], confidence: low, fix: "Use r.message."}
- {id: V15-040, title: "override_whitelisted_methods: last override wins", severity: medium, category: hooks, kind: manual, fix: "Check apps that override the same method; order of apps now decides.", link: "https://github.com/frappe/frappe/pull/22532"}
