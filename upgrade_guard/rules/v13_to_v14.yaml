hop: {from: 13, to: 14}
source: https://github.com/frappe/frappe/wiki/Migrating-to-Version-14
status: complete
rules:
- {id: V14-001, title: "jenv hook renamed to jinja", severity: blocker, category: hooks, kind: hook_key, key: jenv, fix: "Rename to jinja and drop the 'name:' prefix from methods/filters entries.", link: "https://frappeframework.com/docs/user/en/python-api/hooks#jinja-customization"}
- {id: V14-002, title: "build.json no longer supported (esbuild)", severity: blocker, category: build, kind: path_exists, path_glob: ["**/build.json"], fix: "Create *.bundle.js / *.bundle.less files importing the originals; delete build.json."}
- {id: V14-003, title: "app_include_js/css pointing to /assets/js|css/... must use bundle names", severity: high, category: hooks, kind: hook_value_regex, keys: [app_include_js, app_include_css, web_include_js, web_include_css], pattern: "/assets/(js|css)/", fix: "Use my_app.bundle.js / my_app.bundle.css."}
- {id: V14-004, title: "Manual <script>/<link> asset tags", severity: medium, category: build, kind: regex, pattern: "<(script|link)[^>]*/assets/(js|css)/", languages: [html], fix: "Use {{ include_script('x.bundle.js') }} / {{ include_style('x.bundle.css') }}."}
- {id: V14-005, title: "frappe.require with /assets/js paths", severity: high, category: js-api, kind: regex, pattern: "frappe\\.require\\(\\s*[\"'`]/?assets/", languages: [js, client_script], fix: "frappe.require('name.bundle.js')."}
- {id: V14-006, title: "frappe.website.render.render renamed to serve.get_response", severity: blocker, category: python-api, kind: py_name, names: ["frappe.website.render.render", "frappe.website.render"], fix: "from frappe.website.serve import get_response", link: "https://github.com/frappe/frappe/pull/12334"}
- {id: V14-007, title: "clear_cache moved to frappe.website.utils", severity: high, category: python-api, kind: regex, pattern: "from frappe\\.website\\.render import[^\\n]*clear_cache", languages: [python], fix: "from frappe.website.utils import clear_cache", autofix: {replace: [{pattern: "from frappe\\.website\\.render import clear_cache", with: "from frappe.website.utils import clear_cache"}]}}
- {id: V14-008, title: "Workspace JSON uses removed fields (category, is_standard, developer_mode_only, ...)", severity: high, category: doctype, kind: json_has_keys, path_glob: ["**/workspace/**/*.json"], keys: [category, developer_mode_only, disable_user_customization, extends_another_page, pin_to_bottom, pin_to_top, extends], fix: "Recreate the workspace via Workspace 2.0 UI and export it.", link: "https://github.com/frappe/frappe/pull/13152"}
- {id: V14-009, title: "Workspace JSON missing Workspace 2.0 fields (for_user, public, title, content...)", severity: medium, category: doctype, kind: json_missing_keys, path_glob: ["**/workspace/**/*.json"], keys: [public, title, content], fix: "Add Workspace 2.0 fields.", link: "https://github.com/frappe/frappe/pull/13152"}
- {id: V14-010, title: "frappe.db.exists with filter dict no longer returns a list", severity: high, category: python-api, kind: py_call_dict_arg, names: ["frappe.db.exists"], confidence: medium, fix: "Returns name or None now; use frappe.get_all for lists."}
- {id: V14-011, title: "frappe.Plyr needs async library load", severity: low, category: js-api, kind: regex, pattern: "frappe\\.Plyr|new Plyr", languages: [js], fix: "frappe.utils.load_video_player().then(...)"}
- {id: V14-012, title: "get_cached_value no longer raises DoesNotExistError", severity: medium, category: python-api, kind: py_name, names: ["frappe.get_cached_value"], confidence: low, fix: "Check for None instead of catching the exception."}
- {id: V14-013, title: "Document.get requires key", severity: medium, category: python-api, kind: regex, pattern: "\\.get\\(\\s*\\)", languages: [python, server_script], confidence: low, fix: "Pass a key."}
- {id: V14-014, title: "Array values in JSON requests preserved", severity: low, category: api, kind: manual, fix: "Check whitelisted methods that depended on the first-element behaviour.", link: "https://github.com/frappe/frappe/pull/15784"}
- {id: V14-015, title: "Data Migration Tool removed", severity: high, category: doctype, kind: regex, pattern: "Data Migration (Plan|Run|Mapping|Connector)|data_migration", languages: [python, js, json], fix: "Write custom sync or copy the tool into your app.", link: "https://github.com/frappe/frappe/pull/17134"}
- {id: V14-016, title: "frappe.log_error signature changed (title/message order)", severity: high, category: python-api, kind: regex, pattern: "log_error\\(\\s*[^,=()]+\\s*,\\s*[^,=()]+\\s*\\)", languages: [python, server_script], confidence: medium, fix: "Use keyword args: frappe.log_error(title=..., message=...)."}
- {id: V14-017, title: "parent/parenttype/parentfield removed from non-child doctypes", severity: medium, category: doctype, kind: regex, pattern: "\\.(parenttype|parentfield)\\b", languages: [python, server_script], confidence: low, fix: "Use doc.get('parent') after checking istable."}
- {id: V14-018, title: "setup.py / requirements.txt -> pyproject.toml", severity: medium, category: dependency, kind: path_exists, path_glob: ["requirements.txt"], app_root: true, fix: "Move dependencies to pyproject.toml.", link: "https://github.com/frappe/frappe/pull/17174"}
- {id: V14-019, title: "Virtual DocType controller methods must be static", severity: medium, category: python-api, kind: manual, fix: "Add @staticmethod to get_list/get_count/get_stats in virtual doctypes."}
- {id: V14-020, title: "Rating stored as 0-1 decimal", severity: high, category: doctype, kind: db_rating_fields, fix: "Normalize arithmetic on Rating fields (multiply by stars)."}
- {id: V14-021, title: "Removed JS libs (fluxify, bootstrap 3, jquery.hotkeys, prettyDate, express, fuse.js, hyper.js)", severity: medium, category: dependency, kind: regex, pattern: "fluxify|jquery\\.hotkeys|prettyDate|bootstrap_theme|fuse\\.js|hyper\\.js", languages: [js, html], fix: "Add them to your app's own dependencies."}
- {id: V14-022, title: "Removed Python libs (html2text, md5, paytmchecksum, razorpay, stripe, braintree)", severity: high, category: dependency, kind: regex, pattern: "^\\s*(import|from)\\s+(html2text|paytmchecksum|razorpay|stripe|braintree|md5)\\b", languages: [python], fix: "Declare them in your pyproject.toml."}
- {id: V14-023, title: "Glyphicons removed", severity: low, category: ui, kind: regex, pattern: "glyphicon", languages: [html, js, css], fix: "Use Font Awesome / Frappe icons or bundle glyphicons."}
- {id: V14-024, title: "Font Awesome path changed", severity: low, category: ui, kind: regex, pattern: "/assets/frappe/css/font-awesome\\.css", languages: [html, css, python], fix: "/assets/frappe/css/fonts/fontawesome/font-awesome.min.css", autofix: {replace: [{pattern: "/assets/frappe/css/font-awesome\\.css", with: "/assets/frappe/css/fonts/fontawesome/font-awesome.min.css"}]}}
- {id: V14-025, title: "Payment gateways moved to the payments app", severity: high, category: moved-app, kind: regex, pattern: "Payment Gateway|Stripe Settings|PayPal Settings|Razorpay Settings|Braintree Settings|PayTM Settings|frappe\\.integrations\\.(doctype|utils)\\.(stripe|paypal|razorpay|braintree|paytm)", languages: [python, js, json, server_script], fix: "bench get-app payments && bench --site X install-app payments.", link: "https://github.com/frappe/payments"}
- {id: V14-026, title: "Python 3.7+/Node 14+ minimum", severity: blocker, category: environment, kind: env, python_min: "3.7", node_min: "14", fix: "Upgrade runtimes."}
